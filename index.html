<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioData</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        /* Variáveis de Cores (Modo Claro Padrão) */
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: #ffffff;
            --text-title: #2d3748;
            --text-body: #718096;
            --text-option: #4a5568;
            --option-bg: #f7fafc;
            --option-border: #e2e8f0;
            --option-hover-bg: #ebf8ff;
            --progress-bg: #edf2f7;
            --correct-bg: #c6f6d5;
            --correct-text: #276749;
            --wrong-bg: #fed7d7;
            --wrong-text: #9b2c2c;
            --back-btn: #a0aec0;
            --back-btn-hover: #2d3748;
            --justification-bg: #ebf8ff;
            --justification-border: #4299e1;
            --justification-text: #2c5282;
            --next-btn-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --next-btn-hover: #5a67d8;
        }

        /* Variáveis de Cores (Modo Escuro) */
        body.dark-mode {
            --bg-gradient: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            --container-bg: #1a202c;
            --text-title: #f7fafc;
            --text-body: #a0aec0;
            --text-option: #e2e8f0;
            --option-bg: #2d3748;
            --option-border: #4a5568;
            --option-hover-bg: #2c5282;
            --progress-bg: #4a5568;
            --correct-bg: #22543d;
            --correct-text: #c6f6d5;
            --wrong-bg: #742a2a;
            --wrong-text: #fed7d7;
            --back-btn: #718096;
            --back-btn-hover: #f7fafc;
            --justification-bg: #2c5282;
            --justification-border: #4299e1;
            --justification-text: #ebf8ff;
            --next-btn-bg: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --next-btn-hover: #63b3ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-title);
            transition: background 0.3s ease;
        }

        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 40px;
            position: relative;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Botão Tema */
        .theme-toggle {
            position: absolute;
            top: 25px;
            right: 25px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }
        
        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--text-title);
            margin-bottom: 15px;
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
        }

        p {
            text-align: center;
            color: var(--text-body);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .mode-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            display: block;
            width: 100%;
            max-width: 350px;
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn.mode-random {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .btn.mode-menu {
            background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }
        
        .back-btn {
            background: none;
            border: none;
            color: var(--back-btn);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            margin-bottom: 20px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            color: var(--back-btn-hover);
        }

        .progress-container {
            width: 100%;
            background-color: var(--progress-bg);
            border-radius: 10px;
            height: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-option);
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: var(--option-bg);
            border: 2px solid var(--option-border);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-option);
            font-weight: 600;
            line-height: 1.4;
        }

        .option-btn:hover {
            background-color: var(--option-hover-bg);
            border-color: #63b3ed;
            transform: translateX(5px);
        }

        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: #48bb78;
            color: var(--correct-text);
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: #f56565;
            color: var(--wrong-text);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            transform: none;
        }

        /* Área de Justificativa */
        .justification-container {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--justification-bg);
            border: 2px solid var(--justification-border);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .justification-container.show {
            display: block;
        }

        .justification-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--justification-text);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .justification-text {
            font-size: 1rem;
            color: var(--justification-text);
            line-height: 1.6;
            font-weight: 400;
            margin-bottom: 20px;
        }

        /* Botão Próxima Questão */
        .next-btn-container {
            display: none;
            margin-top: 20px;
            text-align: right;
        }

        .next-btn-container.show {
            display: block;
        }

        .next-btn {
            background: var(--next-btn-bg);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .next-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        .score-display {
            font-size: 4rem;
            color: #4facfe;
            font-weight: 800;
            text-align: center;
            margin: 10px 0;
        }
        
        .grade-display {
            font-size: 2rem;
            color: #48bb78;
            font-weight: 800;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Botão Tema (Modo Escuro / Claro) -->
    <button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()" title="Alternar Modo Escuro">🌙</button>

    <!-- Tela Inicial -->
    <div id="start-screen" class="screen active">
        <h1>BioData</h1>
        <p>Conteúdo da disciplina de Bioinformática Geral</p>
        
        <div class="mode-buttons">
            <button class="btn" onclick="startGame('sequential')">Modo Sequencial<br><span style="font-size: 0.8rem; font-weight: 400;">Perguntas na ordem, opções embaralhadas</span></button>
            <button class="btn mode-random" onclick="startGame('random')">Modo Aleatório<br><span style="font-size: 0.8rem; font-weight: 400;">Perguntas e opções embaralhadas</span></button>
        </div>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen" class="screen">
        <button class="back-btn" onclick="switchScreen('start')">⬅ Voltar ao Menu</button>
        
        <div class="stats">
            <span id="question-counter">Questão 1 / 30</span>
            <span id="score-counter">Acertos: 0</span>
        </div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="question-text" class="question-text">Pergunta aqui?</div>
        <div id="options-container" class="options-grid">
            <!-- Botões gerados via JS -->
        </div>
        <div id="justification-container" class="justification-container">
            <div id="justification-title" class="justification-title"></div>
            <div id="justification-text" class="justification-text"></div>
        </div>
        <div id="next-btn-container" class="next-btn-container">
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">
                Próxima questão ➡
            </button>
        </div>
    </div>

    <!-- Tela de Resultados -->
    <div id="result-screen" class="screen">
        <h1>Fim de Jogo!</h1>
        <p>Aqui está o seu resultado final:</p>
        
        <div id="final-score" class="score-display">0/30</div>
        <div id="final-grade" class="grade-display">Nota: 0.0 / 10</div>
        
        <p id="feedback-msg"></p>
        
        <div class="mode-buttons">
            <button class="btn" onclick="restartGame()">Jogar Novamente (Mesmo Modo)</button>
            <button class="btn mode-menu" onclick="switchScreen('start')">⬅ Voltar ao Menu</button>
        </div>
    </div>
</div>

<script>
    // Gerenciamento de Tema Escuro / Claro
    const themeBtn = document.getElementById('theme-toggle');
    
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        
        // Atualiza ícone
        themeBtn.textContent = isDark ? '☀️' : '🌙';
        
        // Salva preferência no navegador
        localStorage.setItem('bioquest-theme', isDark ? 'dark' : 'light');
    }

    // Ao carregar a página, checa a preferência salva
    window.onload = () => {
        const savedTheme = localStorage.getItem('bioquest-theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeBtn.textContent = '☀️';
        }
    };

    // Banco de 30 questões reescritas e balanceadas com justificativas.
    const questions = [
        {
            question: "Qual a principal diferença entre os formatos genômicos FASTA e FASTQ?",
            options: [
                "FASTA guarda apenas coordenadas genômicas estruturais, enquanto FASTQ guarda os alinhamentos completos.",
                "FASTA contém apenas a sequência biológica e cabeçalho; FASTQ adiciona scores de qualidade da leitura.",
                "FASTQ é a versão binária e altamente comprimida do formato FASTA, usada para economizar espaço de disco.",
                "FASTA é de uso exclusivo para transcritos de RNA maduros e FASTQ exclusivo para DNA genômico bruto."
            ],
            answer: 1,
            justification: "O formato de coordenadas e textos FASTA contém unicamente o sequenciamento referencial biológico pareado com o seu cabeçalho, enquanto arquivos FASTQ ampliam a estrutura informacional ao adicionar também os scores de qualidade atrelados a estas leituras transcritas."
        },
        {
            question: "O que exatamente a quarta linha de um registro individual no formato FASTQ armazena?",
            options: [
                "A sequência nucleotídica lida diretamente pelo aparelho, contendo as bases A, C, G, T e N.",
                "O nome da read ou identificador único gerado pelo software da máquina de sequenciamento.",
                "Os valores de qualidade (Phred) codificados em caracteres ASCII correspondentes a cada base lida.",
                "A coordenada cromossômica precisa indicando exatamente onde aquela read deverá ser alinhada."
            ],
            answer: 2,
            justification: "A quarta linha formacional contida internamente em um registro do arquivo FASTQ abriga de modo dedicado os scores de qualidade codificados na conversão em caracteres visuais ASCII (Q scores) designados pontualmente a cada base testada."
        },
        {
            question: "Por que sequenciadores geram resultados em FASTQ, carregando metadados além de apenas a sequência biológica?",
            options: [
                "Para categorizar automaticamente quais sequências pertencem ao grupo de RNA e quais pertencem ao de DNA.",
                "Para informar a probabilidade matemática de erro na identificação de cada base biológica pelo equipamento.",
                "Para empacotar o genoma de referência completo no mesmo arquivo, facilitando o alinhamento posterior.",
                "Porque o antigo formato FASTA não suporta de forma nativa sequências maiores que 150 pares de bases."
            ],
            answer: 1,
            justification: "A estruturação dos dados biológicos em um banco FASTQ inclui os referidos scores de qualidade operacionais puramente com a finalidade de denotar probabilidade quantitativa correspondente à ocorrência de erro mecânico atrelado pontualmente a cada base sequenciada."
        },
        {
            question: "Dentre os grupos de arquivos abaixo, quais são classificados estritamente como formatos de COORDENADAS (anotações/variantes)?",
            options: [
                "Arquivos FASTA, FASTQ e arquivos de metadados experimentais.",
                "Arquivos em formato binário como SAM e BAM não ordenados.",
                "Arquivos estruturados como BED, GFF3 e arquivos VCF.",
                "Arquivos brutos da máquina como FASTQ aliados a um VCF."
            ],
            answer: 2,
            justification: "Ao separar topologicamente os conjuntos de dados lidos, a categoria orientada focada apenas em guardar as informações de coordenadas espaciais das amostras biológicas acomoda especificamente os formatos BED, GFF3, SAM/BAM e as chamadas de arquivos estruturados do VCF."
        },
        {
            question: "Um arquivo BED é muito utilizado na genômica. Quais são as suas três colunas absolutamente obrigatórias?",
            options: [
                "Nome da Query (QNAME), Sinalizador de status (FLAG) e string CIGAR.",
                "Nome do cromossomo, Fonte da anotação e Tipo da feature biológica.",
                "Nome do cromossomo, Posição exata do elemento e ID da variante encontrada.",
                "Nome do cromossomo, Posição genômica inicial e Posição genômica final."
            ],
            answer: 3,
            justification: "Um arquivo em modelo BED (Browser Extensible Data) constrói sua utilidade posicional dependendo inflexivelmente de três colunas cruciais obrigatórias: a descrição referente ao nome de origem do cromossomo (chrom), à posição inicial exata desta área referencial abordada (chromStart) e à correspondente posição de término espacial (chromEnd)."
        },
        {
            question: "Qual a principal característica técnica que diferencia um arquivo BAM de um arquivo SAM?",
            options: [
                "O BAM é um formato restrito ao mapeamento de leituras longas de tecnologias como PacBio.",
                "O BAM omite completamente as sequências lidas, guardando estritamente as coordenadas mapeadas.",
                "O BAM é essencialmente a versão binária e compactada do formato SAM em texto plano legível.",
                "O SAM já vem estruturalmente indexado por padrão, funcionalidade ausente no formato BAM."
            ],
            answer: 2,
            justification: "Diferente do arquivamento em texto plano amplamente legível presente estruturalmente no arquivo SAM original, o formato BAM entrega um modelo equivalente, porém convertido na essência de uma versão operada em forma primariamente binária gerada visando compactação eficiente."
        },
        {
            question: "Em um arquivo SAM/BAM, o mesmo identificador (QNAME) pode se repetir. Qual cenário NÃO justifica essa repetição?",
            options: [
                "A read encontrou alinhamentos múltiplos válidos (multi-mapping) em áreas genômicas diferentes.",
                "O sequenciamento é pareado (Paired-End), logo a Read 1 e a Read 2 compartilham o mesmo QNAME.",
                "A read formou um alinhamento quimérico (suplementar), mapeando porções em locais distintos.",
                "A read obteve um score de qualidade Phred global excessivamente baixo durante o sequenciamento."
            ],
            answer: 3,
            justification: "Repetições legítimas originadas com a mesma nomenclatura de identificador (QNAME) estão justificadas tecnicamente no corpo do SAM/BAM perante a formatação de dados advindos de corridas em alinhamento paired-end, quando se processa uma leitura quimérica dividida entre dois eixos genômicos separados (split-read), e mediante leituras múltiplas simultâneas dotadas de qualidades operacionais correspondentes (multi-mapping). Falhas absolutas no score numérico capturado de Phred não regem nem impactam essa mesma reprodução informacional de nomes no código."
        },
        {
            question: "O que deve ser analisado no formato SAM/BAM para distinguir logicamente os múltiplos registros que compartilham o mesmo QNAME?",
            options: [
                "O escore reportado pela coluna MAPQ de qualidade de mapeamento.",
                "O valor numérico bit a bit (bitwise) presente no campo FLAG.",
                "A extensão das operações descritas pela string alfanumérica CIGAR.",
                "Os caracteres ASCII armazenados obrigatoriamente no campo QUAL."
            ],
            answer: 1,
            justification: "Quando blocos operacionais compartilhando um mesmo QNAME precisam ser isolados e destrinchados perante o alinhamento em SAM/BAM, os pesquisadores empregam o valor interpretado na base decimal e hexadecimal operada na coluna FLAG."
        },
        {
            question: "Considere a string CIGAR: 15M1I34M. Analisando as operações biológicas indicadas, quantas bases físicas compõem essa read no total?",
            options: [
                "Exatamente 49 bases químicas sequenciadas.",
                "Exatamente 50 bases químicas sequenciadas.",
                "Aproximadamente 34 bases químicas sequenciadas.",
                "Aproximadamente 15 bases químicas sequenciadas."
            ],
            answer: 1,
            justification: "A descrição estipulada via CIGAR 15M1I34M pontua empiricamente que existem duas zonas mapeadas diretamente (M) compostas por 15 e 34 bases isoladas, e uma inserção biológica presente centralizada (I) com o tamanho físico composto de 1 base extra. Ao totalizar as variáveis constituintes originais correspondentes que formam de fato a read, chega-se ao valor estatístico de 15 + 1 + 34 = 50 bases pertencentes à query."
        },
        {
            question: "No CIGAR 15M1I34M, sabendo o tamanho total da read, quantas posições geográficas do genoma de referência ela abrange efetivamente?",
            options: [
                "A read cobre uma extensão de 50 posições na referência.",
                "A read cobre uma extensão de 49 posições na referência.",
                "A read cobre uma extensão de 34 posições na referência.",
                "A read cobre uma extensão de 15 posições na referência."
            ],
            answer: 1,
            justification: "Levando em conta que o fator operacional apontado para inserções transversais (I) caracteriza pontualmente bases extras existentes unicamente na amostra avaliada sem equivalente sequenciado genômico subjacente, apenas as correlações mapeadas exatas descritas nas instâncias operacionais em matches (M) englobarão fatias efetivas ocupadas na estrutura fixa do referencial, cobrindo posições que calculam-se como 15 + 34 = 49."
        },
        {
            question: "Analisando o CIGAR alternativo 5S45M: indique a quantidade total de bases na read e a quantidade de posições que ela cobre na referência, respectivamente.",
            options: [
                "O total é 50 bases na read física; e ela ocupa 45 posições na referência genômica.",
                "O total é 45 bases na read física; e ela ocupa 50 posições na referência genômica.",
                "O total é 50 bases na read física; e ela ocupa 50 posições na referência genômica.",
                "O total é 45 bases na read física; e ela ocupa 45 posições na referência genômica."
            ],
            answer: 0,
            justification: "O delineamento sequenciado formatado como 5S45M designa que na fita analisada ocorrem 5 recortes flexíveis (soft-clipped bases contidas internamente no arquivo sem ligação direta a genomas externos) e 45 matches convencionais efetivos sequenciados. A soma física exata para essas extremidades constituintes mantidas pela read forma a quantificação global em 5 + 45 = 50 unidades empíricas, mas ocupa especificamente e exclusivamente 45 blocos nas matrizes abrangidas no mapeamento referencial genômico do fundo testado."
        },
        {
            question: "Como se traduz corretamente a nomenclatura das versões do genoma humano (genome release) entre o repositório do UCSC e o GRC/NCBI?",
            options: [
                "A versão hg19 equivale diretamente à GRCh38; e hg38 equivale à GRCh37.",
                "A versão hg19 equivale diretamente à GRCh37; e hg38 equivale à GRCh38.",
                "Ambos os grandes repositórios padronizaram o uso exclusivo do termo hgX.",
                "O banco de dados do UCSC não armazena ou classifica genomas humanos."
            ],
            answer: 1,
            justification: "Durante as categorizações focadas na versão sequencial operante do genoma estrutural humano originário entre as diferentes instituições e os repositórios correspondentes genéticos, o conjunto nomenclatural consolidado como hg19 hospedado pelo UCSC traduz as amostras de forma padronizada equivalentes ao GRCh37 e repete essas métricas direcionando o hg38 puramente atrelado à versão GRCh38."
        },
        {
            question: "Por que o exato mesmo release genômico (ex: hg38) pode apresentar genes diferentes se o download for feito via NCBI em vez do Ensembl?",
            options: [
                "Porque a sequência fundamental das bases nitrogenadas do DNA sofre mutações entre as plataformas.",
                "Porque o repositório do Ensembl é projetado exclusivamente para abrigar genomas de roedores e plantas.",
                "Porque embora a sequência de nucleotídeos seja idêntica, os pipelines e regras de anotação funcional diferem.",
                "Porque plataformas divergentes utilizam tecnologias de interpretação de sequenciamento incompatíveis."
            ],
            answer: 2,
            justification: "Quando bases biológicas paralelas estruturais, como os conjuntos do Ensembl comparados perante os do banco NCBI, compartilham formalmente as instâncias relativas ao mesmo conjunto e à sequência basal, a variabilidade pontual decorrente reside primariamente das regras estritas independentes estruturais exclusivas formuladas operadas durante os múltiplos pipelines originais focados em anotação mantidos entre ambas."
        },
        {
            question: "Qual programa alinhador disponível na bioinformática moderna é o mais adequado para mapear reads curtas de RNA eucariótico (splice-aware)?",
            options: [

    let currentQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let currentMode = 'random';

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    const screens = {
        start: document.getElementById('start-screen'),
        quiz: document.getElementById('quiz-screen'),
        result: document.getElementById('result-screen')
    };
    
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progressBar = document.getElementById('progress-bar');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const finalScore = document.getElementById('final-score');
    const finalGrade = document.getElementById('final-grade');
    const feedbackMsg = document.getElementById('feedback-msg');
    const justificationContainer = document.getElementById('justification-container');
    const justificationTitle = document.getElementById('justification-title');
    const justificationText = document.getElementById('justification-text');
    const nextBtnContainer = document.getElementById('next-btn-container');
    const nextBtn = document.getElementById('next-btn');

    function switchScreen(screenName) {
        Object.values(screens).forEach(screen => screen.classList.remove('active'));
        screens[screenName].classList.add('active');
    }

    function startGame(mode) {
        currentMode = mode || currentMode;
        
        if (currentMode === 'sequential') {
            currentQuestions = [...questions];
        } else {
            currentQuestions = shuffleArray([...questions]);
        }
        
        currentQuestionIndex = 0;
        score = 0;
        switchScreen('quiz');
        loadQuestion();
    }

    function loadQuestion() {
        const q = currentQuestions[currentQuestionIndex];
        
        questionText.textContent = q.question;
        const progressPercent = ((currentQuestionIndex) / currentQuestions.length) * 100;
        progressBar.style.width = `${progressPercent}%`;
        
        const questionNumberToDisplay = currentQuestionIndex + 1;
        questionCounter.textContent = `Questão ${questionNumberToDisplay} / ${currentQuestions.length}`;
        
        scoreCounter.textContent = `Acertos: ${score}`;
        optionsContainer.innerHTML = '';
        justificationContainer.classList.remove('show');
        nextBtnContainer.classList.remove('show');
        
        const originalCorrectText = q.options[q.answer];
        const shuffledOptions = shuffleArray([...q.options]);
        const newCorrectIndex = shuffledOptions.indexOf(originalCorrectText);

        shuffledOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.classList.add('option-btn');
            btn.textContent = opt;
            btn.onclick = () => selectOption(index, btn, newCorrectIndex, shuffledOptions);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, buttonClicked, correctIndex, optionsArray) {
        const buttons = optionsContainer.querySelectorAll('.option-btn');
        buttons.forEach(btn => btn.disabled = true);

        const isCorrect = selectedIndex === correctIndex;
        
        if (isCorrect) {
            buttonClicked.classList.add('correct');
            score++;
            scoreCounter.textContent = `Acertos: ${score}`;
            justificationTitle.textContent = "✅ Correto!";
            justificationTitle.style.color = "var(--correct-text)";
        } else {
            buttonClicked.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
            justificationTitle.textContent = "❌ Incorreto";
            justificationTitle.style.color = "var(--wrong-text)";
        }

        // Mostrar justificativa
        const q = currentQuestions[currentQuestionIndex];
        justificationText.textContent = q.justification;
        justificationContainer.classList.add('show');
        
        // Mostrar botão "Próxima questão"
        nextBtnContainer.classList.add('show');
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        switchScreen('result');
        progressBar.style.width = '100%';
        
        finalScore.textContent = `${score} / ${currentQuestions.length}`;
        
        const calculoNota = ((score / currentQuestions.length) * 10).toFixed(1);
        finalGrade.textContent = `Nota: ${calculoNota} / 10`;
        
        if (score >= 25) {
            feedbackMsg.textContent = "Excelente! Você dominou alinhamento, genomas e RNA-Seq.";
            finalGrade.style.color = "#48bb78";
        } else if (score >= 15) {
            feedbackMsg.textContent = "Muito bom! Continue praticando os conceitos para fixá-los de vez.";
            finalGrade.style.color = "#ecc94b";
        } else {
            feedbackMsg.textContent = "Continue tentando! A repetição é a chave do aprendizado.";
            finalGrade.style.color = "#f56565";
        }
    }

    function restartGame() {
        startGame(currentMode);
    }
